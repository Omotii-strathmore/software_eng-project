
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vehicle Sales System - Customer Registration</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .error {
      color: red;
      font-size: 13px;
      margin-top: -10px;
      margin-bottom: 10px;
      display: none;
    }
    .valid { border-color: #28a745; }
    .invalid { border-color: red; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Holiday Travel Vehicle Sales System</h1>
    <h2>Customer Registration</h2>

    <form id="registerForm" class="form-box" novalidate>
      <label>Full Name</label>
      <input type="text" id="fullname" placeholder="Enter your full name" required>
      <div id="nameError" class="error">Full name must contain only letters (A–Z).</div>

      <label>Email Address</label>
      <input type="email" id="email" placeholder="Enter your email" required>
      <div id="emailError" class="error">Email must include both letters and numbers.</div>

      <label>Phone Number</label>
      <input type="tel" id="phone" placeholder="e.g. 0712345678" required>
      <div id="phoneError" class="error">Phone must be numeric and ≤10 digits.</div>

      <label>Username</label>
      <input type="text" id="username" placeholder="Choose a username" required>
      <div id="userError" class="error">Username is required.</div>

      <label>Password</label>
      <input type="password" id="password" placeholder="8 characters only" required>
      <div id="passError" class="error">Password must be exactly 8 characters.</div>

      <input type="hidden" id="role" value="Customer">

      <button type="submit" class="btn">Register</button>
      <p class="note">Already have an account? <a href="login.html">Login here</a></p>
    </form>
  </div>

  <script>
    const form = document.getElementById("registerForm");
    const fields = {
      name: fullname,
      email: email,
      phone: phone,
      username: username,
      password: password
    };

    // Real-time validation
    fields.name.addEventListener("input", () => {
      if (/^[A-Za-z ]+$/.test(fields.name.value.trim())) {
        nameError.style.display = "none";
        fields.name.classList.add("valid");
        fields.name.classList.remove("invalid");
      } else {
        nameError.style.display = "block";
        fields.name.classList.add("invalid");
        fields.name.classList.remove("valid");
      }
    });

    fields.email.addEventListener("input", () => {
      if (/(?=.*[a-zA-Z])(?=.*\d)/.test(fields.email.value.trim())) {
        emailError.style.display = "none";
        fields.email.classList.add("valid");
        fields.email.classList.remove("invalid");
      } else {
        emailError.style.display = "block";
        fields.email.classList.add("invalid");
        fields.email.classList.remove("valid");
      }
    });

    fields.phone.addEventListener("input", () => {
      if (/^\d{1,10}$/.test(fields.phone.value.trim())) {
        phoneError.style.display = "none";
        fields.phone.classList.add("valid");
        fields.phone.classList.remove("invalid");
      } else {
        phoneError.style.display = "block";
        fields.phone.classList.add("invalid");
        fields.phone.classList.remove("valid");
      }
    });

    fields.password.addEventListener("input", () => {
      if (fields.password.value.trim().length === 8) {
        passError.style.display = "none";
        fields.password.classList.add("valid");
        fields.password.classList.remove("invalid");
      } else {
        passError.style.display = "block";
        fields.password.classList.add("invalid");
        fields.password.classList.remove("valid");
      }
    });

    fields.username.addEventListener("input", () => {
      if (fields.username.value.trim() !== "") {
        userError.style.display = "none";
        fields.username.classList.add("valid");
        fields.username.classList.remove("invalid");
      } else {
        userError.style.display = "block";
        fields.username.classList.add("invalid");
        fields.username.classList.remove("valid");
      }
    });

    form.addEventListener("submit", (e) => {
      e.preventDefault();

      const allValid =
        /^[A-Za-z ]+$/.test(fields.name.value.trim()) &&
        /(?=.*[a-zA-Z])(?=.*\d)/.test(fields.email.value.trim()) &&
        /^\d{1,10}$/.test(fields.phone.value.trim()) &&
        fields.username.value.trim() !== "" &&
        fields.password.value.trim().length === 8;

      if (allValid) {
        const role = "Customer";
        alert(`Registration successful! Welcome ${fields.name.value} (${role}).`);
        window.location.href = "login.html";
      }
    });
  </script>
</body>
</html>
